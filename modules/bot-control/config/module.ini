# Bot Control Menu: an HTML menu whose buttons send party-chat commands
# to Living World phantoms. Set Enabled = True and restart to use.

Enabled = True

# Voiced command (dot command) that opens the menu.
VoicedCommand = botmenu

# ===== Movement =====
BypassAssist       = _bbsbot_assist
BypassAttackFreely = _bbsbot_attackfreely
BypassFollow       = _bbsbot_follow
BypassHold         = _bbsbot_hold
BypassGather       = _bbsbot_gather

# ===== Raid orders =====
BypassTankAttack = _bbsbot_tankattack
BypassAllAttack  = _bbsbot_allattack
BypassHoldFire   = _bbsbot_holdfire

# ===== Support =====
BypassBuffMe   = _bbsbot_buffme
BypassBuffAll  = _bbsbot_buffall
BypassHealMe   = _bbsbot_healme
BypassRes      = _bbsbot_res
BypassSongs    = _bbsbot_songs
BypassDance    = _bbsbot_dance

# ===== Loot =====
BypassReturnLoot      = _bbsbot_returnloot
BypassPartyReturnLoot = _bbsbot_partyreturnloot

# ===== Party =====
BypassStatus  = _bbsbot_status
BypassBrb     = _bbsbot_brb
BypassDisband = _bbsbot_disband

# Text sent to the party for each menu button.
# These are the exact keywords the Living World AI listens for.
ChatAssist       = assist
ChatAttackFreely = attack freely
ChatFollow       = follow
ChatHold         = hold
ChatGather       = gather

ChatTankAttack = tank attack
ChatAllAttack  = all attack
ChatHoldFire   = hold fire

ChatBuffMe   = buff me
ChatBuffAll  = buff all
ChatHealMe   = heal me
ChatRes      = res
ChatSongs    = songs
ChatDance    = dance

ChatReturnLoot      = return loot
ChatPartyReturnLoot = party return loot

ChatStatus  = status
ChatBrb     = brb
ChatDisband = disband