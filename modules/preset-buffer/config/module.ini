# Preset Buffer module
# Master on/off switch. With this False the module does nothing, its NPC is not
# loaded or spawned, and the server is stock. Set True and restart to enable.
Enabled = True

# Adena charged per buff when a one-click preset is used. 0 = free.
PricePerBuff = 0

# Adena charged for each single buff picked from the category pages. 0 = free.
BuffPrice = 0

# Adena charged for Heal. 0 = free.
HealPrice = 0

# Also buff the player's summon/pet.
BuffSummon = True
