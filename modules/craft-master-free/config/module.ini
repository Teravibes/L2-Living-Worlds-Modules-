# Craft Master (No Recipe) module
# Master on/off switch. With this False the module does nothing, its NPC is not
# loaded or spawned, and the server is stock. Set True and restart to enable.
Enabled = False

# Materials needed, as a percent of the recipe's normal amounts, rounded down.
# This applies to recipes that can fail (the 60% recipes). 180 = 1.8x.
# Recipes that already succeed 100% of the time always use their normal amounts.
MaterialPercent = 180

# Extra Adena charged per craft. 0 = free.
AdenaFee = 0
