# Buff Limits: 2-hour durations for buffer-NPC buffs and perma-uptime class self buffs.
# Master on/off switch. With this False the module does nothing and the server is stock.
# Set True and restart to apply. Everything is changed in memory at startup, so
# setting it back to False and restarting restores stock behavior.
Enabled = True

# Duration in seconds (7200 = 2 hours) for the 85 buffer-NPC buffs (Might, Shield, songs, dances...).
# Set 0 to leave them alone.
BuffDurationSeconds = 7200

# Duration in seconds for class self buffs meant for permanent uptime (War Cry, Rage, Battle Roar,
# Sprint, Majesty, auras, etc). Burst/emergency skills like Frenzy, Guts, Zealot are never touched.
# Set 0 to leave them alone.
SelfBuffDurationSeconds = 7200

# NOTE: buff and song/dance slots are not handled here. Set them in game/config/Player.ini:
#   MaxBuffAmount = 40
#   MaxDanceAmount = 32
